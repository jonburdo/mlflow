name: Publish Base Image Cache

on:
  workflow_dispatch:
    inputs:
      pr_number: { description: Pull request number, required: true, type: string }
      head_repository: { description: Pull request head repository, required: true, type: string }
      head_sha: { description: Pull request commit SHA, required: true, type: string }

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: base-image-cache-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository_owner == 'jonburdo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Verify approved pull request revision and image sources
        id: images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPOSITORY: ${{ inputs.head_repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Re-fetch the PR so manually supplied dispatch inputs cannot authorize another revision.
          pr=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          test "$(jq -r '.head.repo.full_name' <<< "$pr")" = "$HEAD_REPOSITORY"
          test "$(jq -r '.head.sha' <<< "$pr")" = "$HEAD_SHA"
          # Test-only: permit the same-repository PR used to simulate an external PR.
          has_label=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --jq 'map(.name) | any(. == "ok-to-test")')
          case "$(jq -r '.author_association' <<< "$pr")" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) test "$has_label" = true ;;
          esac
          base_ref=$(jq -r '.base.ref' <<< "$pr")
          test -n "$base_ref" && test "$base_ref" != null
          images=$(jq -cn \
            --arg head_repository "$HEAD_REPOSITORY" \
            --arg head_sha "$HEAD_SHA" \
            --arg operator_repository "${REPOSITORY_OWNER}/mlflow-operator" \
            --arg base_ref "$base_ref" '[
            {
              name: "MLflow",
              repository: $head_repository,
              ref: $head_sha,
              dockerfile: "Dockerfile.konflux",
              cache_path: ".mlflow-base-image-cache"
            },
            {
              name: "operator",
              repository: $operator_repository,
              ref: $base_ref,
              dockerfile: "Dockerfile.konflux",
              cache_path: ".operator-base-image-cache"
            }
          ]')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.verify.outputs.images) }}
    permissions:
      contents: read
    steps:
      - name: Checkout ${{ matrix.image.name }} Dockerfile only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ matrix.image.repository }}
          ref: ${{ matrix.image.ref }}
          sparse-checkout: ${{ matrix.image.dockerfile }}
          path: source
          persist-credentials: false
      - name: Resolve and validate ${{ matrix.image.name }} base image
        id: base-image
        env:
          DOCKERFILE: source/${{ matrix.image.dockerfile }}
          IMAGE_NAME: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          base_image=$(sed -nE 's/^ARG BASE_IMAGE=(.+)$/\1/p' "$DOCKERFILE")
          # Tags alone are mutable and cannot safely identify a cache entry.
          # A tag plus @sha256 is valid.
          if ! [[ "$base_image" =~ ^[^[:space:]@]+@sha256:([0-9a-f]{64})$ ]]; then
            echo "::error::${DOCKERFILE} must contain one digest-pinned base image reference"
            exit 1
          fi
          digest="${BASH_REMATCH[1]}"
          {
            echo "base_image=$base_image"
            echo "cache_key=base-image-${RUNNER_OS,,}-${RUNNER_ARCH,,}-$digest"
            echo "local_tag=localhost/base-image:${digest:0:12}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $IMAGE_NAME base image: $base_image"
      - name: Restore existing base image cache
        id: cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ matrix.image.cache_path }}
          key: ${{ steps.base-image.outputs.cache_key }}
      - name: Log in to Red Hat registry
        if: steps.cache.outputs.cache-hit != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USERNAME }}
          password: ${{ secrets.RH_REGISTRY_PASSWORD }}
      - name: Pull and package base image
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BASE_IMAGE: ${{ steps.base-image.outputs.base_image }}
          CACHE_PATH: ${{ matrix.image.cache_path }}
          LOCAL_TAG: ${{ steps.base-image.outputs.local_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$CACHE_PATH"
          docker pull "$BASE_IMAGE"
          docker tag "$BASE_IMAGE" "$LOCAL_TAG"
          docker save -o "$CACHE_PATH/base-image.tar" "$LOCAL_TAG"
          printf '%s\n' "$BASE_IMAGE" > "$CACHE_PATH/expected-ref.txt"
          printf '%s\n' "$LOCAL_TAG" > "$CACHE_PATH/local-tag.txt"
          (cd "$CACHE_PATH" && sha256sum base-image.tar > SHA256SUMS)
      - name: Save base image cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ matrix.image.cache_path }}
          key: ${{ steps.base-image.outputs.cache_key }}

      - name: Write cache summary
        if: always()
        env:
          BASE_IMAGE: ${{ steps.base-image.outputs.base_image }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.base-image.outputs.cache_key }}
          IMAGE_NAME: ${{ matrix.image.name }}
          SOURCE_REF: ${{ matrix.image.ref }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]]; then
            status="reused existing cache"
          else
            status="published cache"
          fi
          {
            echo "### ${IMAGE_NAME} base image cache"
            echo "- Source ref: \`${SOURCE_REF}\`"
            echo "- Base image: \`${BASE_IMAGE}\`"
            echo "- Cache key: \`${CACHE_KEY}\`"
            echo "- Result: ${status}"
          } >> "$GITHUB_STEP_SUMMARY"

  rerun-failed-pr-builds:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Rerun matching failed PR build jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Rerun the original PR jobs to preserve their pull_request context
          # instead of dispatching a fork ref.
          workflows=(operator-integration-tests.yml)
          for workflow in "${workflows[@]}"; do
            while read -r run_id; do
              [[ -z "$run_id" ]] && continue
              if ! gh api \
                "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
                --paginate \
                --jq '
                  .jobs[]
                  | select(.conclusion == "failure")
                  | select(any(.steps[]?; .conclusion == "failure" and
                      (.name == "Require cached MLflow base image" or
                       .name == "Require cached operator base image")))
                  | .id
                ' \
                | grep -q .; then
                echo "Workflow run ${run_id} did not fail while restoring a base image cache."
                continue
              fi
              gh api "repos/${REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs" -X POST || \
                echo "::warning::Unable to rerun failed jobs for workflow run ${run_id}"
            done < <(
              printf -v workflow_runs_endpoint '%s%s' \
                "repos/${REPOSITORY}/actions/workflows/${workflow}/runs" \
                "?event=pull_request&head_sha=${HEAD_SHA}&per_page=100"
              gh api \
                "$workflow_runs_endpoint" \
                --jq '
                  .workflow_runs[]
                  # A cache-dependent job can fail while unrelated jobs keep the
                  # workflow in progress, so do not require a run conclusion here.
                  | select(.run_attempt == 1)
                  | .id
                '
            )
          done
