# Syft configuration for repo-root SBOM generation.
# Dockerfile.konflux installs Python dependencies from requirements/konflux-requirements.txt,
# so exclude other manifests that are not part of the Konflux image build.

default-catalogers:
  - python-package-cataloger
  - javascript-lock-cataloger

select-catalogers:
  - "-file"

file:
  metadata:
    selection: none

exclude:
  - ./.venv/**
  - ./.github/**
  - ./.claude/**
  - ./docs/**
  - ./examples/**
  - ./tests/**
  - ./dev/**
  - ./bin/**
  - ./docker/**
  - ./docker-compose/**
  - ./changelogs/**
  - ./artifacts/**
  - ./libs/**
  - ./kubernetes-workspace-provider/**
  - ./uv.lock
  - ./pyproject.toml
  - ./pyproject.release.toml
  - ./requirements/*.yaml
  - ./requirements/constraints.txt
  - ./requirements/dev-requirements.txt
  - ./requirements/doc-min-requirements.txt
  - ./requirements/doc-requirements.txt
  - ./requirements/extra-ml-requirements.txt
  - ./requirements/konflux.in
  - ./requirements/lint-requirements.txt
  - ./requirements/requirements.txt
  - ./requirements/skinny-test-requirements.txt
  - ./requirements/test-requirements.txt
  - ./mlflow/server/js/package-lock.json
  - ./mlflow/server/js/node_modules/**
  - ./mlflow/server/js/build/**
